name: Entregável
description: Uma entrega de uma frente, com critério objetivo de pronto
title: "Frente · "
body:
  - type: dropdown
    id: frente
    attributes:
      label: Frente
      options:
        - Protocolo
        - Verificação
        - Produto
        - Pesquisa
        - Institucional
        - Coordenação
    validations:
      required: true
  - type: textarea
    id: oque
    attributes:
      label: O que é
      description: Uma ou duas frases.
    validations:
      required: true
  - type: textarea
    id: pronto
    attributes:
      label: Fecha quando
      description: Critério objetivo. Quem ler precisa conseguir responder sim ou não.
    validations:
      required: true
  - type: dropdown
    id: tamanho
    attributes:
      label: Tamanho
      description: Maior que 5 horas? Quebre em mais de uma issue.
      options:
        - P (até 2h)
        - M (até 5h)
    validations:
      required: true
  - type: input
    id: depende
    attributes:
      label: Depende de
      placeholder: "#12, ou nada"
