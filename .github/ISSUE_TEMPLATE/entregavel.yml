name: Tarefa
description: Uma entrega pequena, com critério de pronto que dá para responder sim ou não
title: "Código · "
body:
  - type: textarea
    id: fazer
    attributes:
      label: O que fazer
      description: Uma ou duas frases. Comece o título com a frente (Código, Telas ou Pesquisa).
    validations:
      required: true
  - type: textarea
    id: pronto
    attributes:
      label: Pronto quando
      description: Quem ler precisa conseguir responder sim ou não.
    validations:
      required: true
  - type: dropdown
    id: etapa
    attributes:
      label: Etapa
      options:
        - 1. Decidido (13/11)
        - 2. Roda no terminal (27/11)
        - 3. Roda no celular (11/12)
    validations:
      required: true
